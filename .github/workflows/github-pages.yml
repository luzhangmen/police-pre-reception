# Publish frontend/public to GitHub Pages (map demo works without backend).
# Enable: Repo Settings → Pages → Source: GitHub Actions
# Optional secret: AMAP_WEB_KEY (高德 JS API，需在白名单添加 https://<user>.github.io)

name: Deploy GitHub Pages Demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build demo-env.js
        run: |
          if [ -n "${{ secrets.AMAP_WEB_KEY }}" ]; then
            printf '%s\n' "// Generated by GitHub Actions — do not commit real keys." > frontend/public/demo-env.js
            printf '%s\n' "window.__DEMO_AMAP_KEY__ = \"${{ secrets.AMAP_WEB_KEY }}\";" >> frontend/public/demo-env.js
          else
            printf '%s\n' 'window.__DEMO_AMAP_KEY__ = "";' > frontend/public/demo-env.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
